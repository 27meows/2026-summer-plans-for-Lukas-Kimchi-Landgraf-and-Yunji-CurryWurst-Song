<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 summer holiday in Europe</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial, Helvetica, sans-serif;background:#f4f6fb;margin:0;color:#222}
.wrapper{max-width:1320px;margin:auto;padding:22px}
h1{text-align:center;font-size:34px;margin:8px 0 18px;font-weight:800;letter-spacing:.2px}
.top-bar{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:14px;font-size:13px}
.top-bar input{width:90px;border:1px solid #cfd6e3;border-radius:8px;padding:5px 7px;font-size:13px}.save-status{margin-right:auto;color:#667085;font-size:12px}
.weekday{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:8px}.weekday div{text-align:center;font-weight:800;padding:6px 0;background:white;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.04)}.sun{color:#d33}.sat{color:#2768d8}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:stretch}.day{background:#fff;border-radius:12px;padding:8px;min-height:286px;box-shadow:0 3px 8px rgba(0,0,0,.07);border-top:6px solid #cfd6e3;display:flex;flex-direction:column;gap:5px;overflow:visible}.header{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;margin-bottom:2px}
.line{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px;align-items:start}.label{font-size:11px;color:#555;font-weight:700;padding-top:4px}.text-field{width:100%;min-width:0;border:1px solid #d7deea;border-radius:6px;padding:3px 5px;font-size:12px;line-height:1.25;resize:none;overflow:hidden;white-space:pre-wrap;word-break:break-word;font-family:inherit;background:#fbfcff;min-height:24px;height:24px}.where{height:24px;min-height:24px;white-space:nowrap;overflow:hidden}
.money-row{display:grid;grid-template-columns:34px 1fr 1fr;gap:4px;align-items:center;margin-top:-2px}.money-box{display:flex;align-items:center;border:1px solid #d7deea;border-radius:6px;background:#fbfcff;overflow:hidden;height:23px;min-width:0}.currency{font-size:11px;font-weight:800;padding-left:5px;color:#555;flex:0 0 auto}.money-input{width:100%;min-width:0;border:none;background:transparent;padding:3px 4px;font-size:10px;outline:none;-moz-appearance:textfield}.money-input::-webkit-outer-spin-button,.money-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.section-title{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:#333;margin-top:2px}.add-mini{border:none;background:#edf2ff;color:#1d4ed8;border-radius:999px;font-size:11px;font-weight:800;line-height:1;padding:3px 7px;cursor:pointer}.todo-list{display:flex;flex-direction:column;gap:3px}.todo{display:grid;grid-template-columns:14px minmax(0,1fr) 14px;gap:2px;align-items:start;width:100%}.todo input[type="checkbox"]{margin:3px 0 0 0;width:13px;height:13px}.todo-text{width:100%;min-width:0;border:1px solid #d7deea;border-radius:6px;padding:3px 4px;font-size:12px;line-height:1.25;resize:none;overflow:hidden;white-space:pre-wrap;word-break:break-word;font-family:inherit;background:#fbfcff;min-height:23px;height:23px}.del{border:none;background:transparent;color:#888;font-size:11px;cursor:pointer;padding:1px 0}
.prep-card{gap:5px}.prep-list{display:flex;flex-direction:column;gap:4px;flex:1}.prep-item{display:grid;grid-template-columns:14px minmax(0,1fr) 14px;gap:3px;align-items:start}.prep-item input[type="checkbox"]{margin:3px 0 0 0;width:13px;height:13px}
.board-divider{margin:38px 0 20px;border:0;border-top:4px solid #c2cad8}.postit-board{display:block;width:100%;clear:both;background:#eef2f7;border-radius:18px;padding:18px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}.postit-board h2{margin:0 0 14px;font-size:22px}.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,150px));gap:12px;align-items:start}.note,.add-note{width:150px;min-height:116px;border-radius:12px;box-shadow:2px 4px 10px rgba(0,0,0,.16);position:relative;padding:12px;background:#fff8a6}.note.pack{background:#bfe3ff}.note button{position:absolute;top:5px;right:7px;border:none;background:transparent;cursor:pointer;color:#555}.note textarea{width:100%;min-height:88px;border:none;background:transparent;resize:none;overflow:hidden;font-family:inherit;font-size:13px;line-height:1.35;padding:4px 12px 4px 0;white-space:pre-wrap;word-break:break-word}.add-note{border:none;background:#d9dee8;color:#333;font-size:28px;font-weight:700;cursor:pointer}.add-note.pack{background:#c9dff0}
@media(max-width:1100px){.weekday,.calendar{grid-template-columns:repeat(2,1fr)}.weekday{display:none}.day{min-height:286px}}@media(max-width:620px){.calendar{grid-template-columns:1fr}.day{min-height:280px}.top-bar{justify-content:center;flex-wrap:wrap}.save-status{width:100%;text-align:center;margin-right:0}}
</style>
</head>
<body>
<div class="wrapper">
<h1>2026 summer holiday in Europe</h1>
<div class="top-bar"><span id="saveStatus" class="save-status">연결 준비 중</span><span>환율 1€ =</span><input id="rate" type="number" value="1600" oninput="recalculateAllMoney(); savePlanner();"><span>원</span></div>
<div class="weekday"><div class="sun">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="sat">토</div></div>
<div id="calendar" class="calendar"></div>
<hr class="board-divider"><section class="postit-board"><h2>아이디어 포스트잇</h2><div id="notes" class="notes"></div></section>
<hr class="board-divider"><section class="postit-board"><h2>윤지 챙겨갈 것</h2><div id="packingNotes" class="notes"></div></section>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const STORAGE_KEY='europeTripPlanner2026_backup_v3';
const firebaseConfig = {
  apiKey: "AIzaSyAdxcQXgFg4mrF3022eQIG_sG0e0wQeS6g",
  authDomain: "yunji-travel-planner.firebaseapp.com",
  projectId: "yunji-travel-planner",
  storageBucket: "yunji-travel-planner.firebasestorage.app",
  messagingSenderId: "175419854114",
  appId: "1:175419854114:web:a7166c41cb85b79d0d697b",
  measurementId: "G-X010BP6S06"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const plannerDocRef = db.collection('travel').doc('plan');
let isLoading=false, saveTimer=null, lastSavedJson='', unsubscribeFirebase=null, pendingRemoteData=null;
function isFirebaseConnected(){return !!plannerDocRef;}
function autoResize(el){el.style.height='23px';el.style.height=Math.max(23,el.scrollHeight)+'px'}
function escapeHtml(str){return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}
function makeTextarea(className='',placeholder=''){return `<textarea class="${className}" placeholder="${placeholder}" oninput="autoResize(this); savePlanner();"></textarea>`}
function addTodo(button,value='',checked=false){const list=button.closest('.section-title').nextElementSibling;const item=document.createElement('div');item.className='todo';item.innerHTML=`<input type="checkbox" ${checked?'checked':''} onchange="savePlanner()"><textarea class="todo-text" oninput="autoResize(this); savePlanner();">${escapeHtml(value)}</textarea><button class="del" onclick="this.closest('.todo').remove(); savePlanner();">x</button>`;list.appendChild(item);autoResize(item.querySelector('textarea'))}
function todoItems(count=3){let html='';for(let i=0;i<count;i++)html+=`<div class="todo"><input type="checkbox" onchange="savePlanner()"><textarea class="todo-text" oninput="autoResize(this); savePlanner();"></textarea><button class="del" onclick="this.closest('.todo').remove(); savePlanner();">x</button></div>`;return html}
function prepItems(){let html='';for(let i=0;i<8;i++)html+=`<div class="prep-item"><input type="checkbox" onchange="savePlanner()"><textarea class="todo-text" oninput="autoResize(this); savePlanner();"></textarea><button class="del" onclick="this.closest('.prep-item').remove(); savePlanner();">x</button></div>`;return html}
function moneyRow(){return `<div class="money-row"><span></span><div class="money-box"><span class="currency">€</span><input class="money-input eur" type="text" inputmode="decimal" oninput="handleMoneyInput(this,'eur')"></div><div class="money-box"><span class="currency">₩</span><input class="money-input krw" type="text" inputmode="numeric" oninput="handleMoneyInput(this,'krw')"></div></div>`}
function createDay(date,day,prep=false){if(prep)return `<article class="day prep-card" data-date="${date}" data-prep="true"><div class="header"><span>${date}</span><span class="${day==='일'?'sun':day==='토'?'sat':''}">${day}</span></div><div class="prep-list">${prepItems()}</div></article>`;return `<article class="day" data-date="${date}"><div class="header"><span>${date}</span><span class="${day==='일'?'sun':day==='토'?'sat':''}">${day}</span></div><div class="line"><span class="label">어디</span>${makeTextarea('text-field where','')}</div><div class="line"><span class="label">숙소</span>${makeTextarea('text-field','')}</div>${moneyRow()}<div class="line"><span class="label">교통</span>${makeTextarea('text-field','')}</div>${moneyRow()}<div class="section-title"><span>오전</span><button class="add-mini" onclick="addTodo(this)">+</button></div><div class="todo-list">${todoItems(3)}</div><div class="section-title"><span>오후</span><button class="add-mini" onclick="addTodo(this)">+</button></div><div class="todo-list">${todoItems(3)}</div></article>`}
const days=[['7/19','일',true],['7/20','월',true],['7/21','화',true],['7/22','수',true],['7/23','목',true],['7/24','금',true],['7/25','토'],['7/26','일'],['7/27','월'],['7/28','화'],['7/29','수'],['7/30','목'],['7/31','금'],['8/1','토'],['8/2','일'],['8/3','월'],['8/4','화'],['8/5','수'],['8/6','목'],['8/7','금'],['8/8','토'],['8/9','일'],['8/10','월'],['8/11','화'],['8/12','수'],['8/13','목'],['8/14','금'],['8/15','토'],['8/16','일'],['8/17','월'],['8/18','화'],['8/19','수']];
document.getElementById('calendar').innerHTML=days.map(d=>createDay(d[0],d[1],d[2])).join('');
function getRate(){return Number(document.getElementById('rate').value)||0}function roundToTens(num){return Math.round(num/10)*10}function cleanEuro(value){return value.replace(/[^0-9.]/g,'').replace(/(\..*)\./g,'$1')}function cleanKrw(value){return value.replace(/[^0-9]/g,'')}function formatEuro(num){return Number(num).toFixed(2)}function formatKrw(num){return String(roundToTens(num)).toLocaleString('ko-KR');}
function handleMoneyInput(input,type){const box=input.closest('.money-row'),eur=box.querySelector('.eur'),krw=box.querySelector('.krw'),rate=getRate();if(type==='eur'){eur.value=cleanEuro(eur.value);const value=parseFloat(eur.value);krw.value=!isNaN(value)&&rate?formatKrw(value*rate):''}else{const cleanValue = cleanKrw(krw.value);
const value = parseFloat(cleanValue);

krw.value = cleanValue ? Number(cleanValue).toLocaleString('ko-KR') : '';

eur.value = !isNaN(value) && rate ? formatEuro(value / rate) : '';}savePlanner()}
function recalculateAllMoney(){document.querySelectorAll('.money-row').forEach(row=>{const eur=row.querySelector('.eur'),krw=row.querySelector('.krw');if(eur.value){const value=parseFloat(eur.value);if(!isNaN(value))krw.value=formatKrw(value*getRate())}else if(krw.value){const value=parseFloat(krw.value);if(!isNaN(value))eur.value=formatEuro(value/getRate())}})}
function setupNoteBoard(boardId,pack=false){document.getElementById(boardId).innerHTML=`<button class="add-note ${pack?'pack':''}" onclick="addNoteTo('${boardId}','',${pack})">+</button>`}
function addNoteTo(boardId,text='',pack=false){const note=document.createElement('div');note.className=pack?'note pack':'note';note.innerHTML=`<button onclick="this.parentElement.remove(); savePlanner();">x</button><textarea oninput="autoResize(this); savePlanner();">${escapeHtml(text)}</textarea>`;const addButton=document.querySelector(`#${boardId} .add-note`);document.getElementById(boardId).insertBefore(note,addButton);autoResize(note.querySelector('textarea'));if(!isLoading)savePlanner()}
function applyWhereColor(textarea){const val=textarea.value,card=textarea.closest('.day');if(val.includes('영국'))card.style.borderTopColor='#2563eb';else if(val.includes('독일'))card.style.borderTopColor='#dc2626';else card.style.borderTopColor='#cfd6e3'}
function setupWhereColors(){document.querySelectorAll('.where').forEach(input=>input.addEventListener('input',e=>{autoResize(e.target);applyWhereColor(e.target);savePlanner()}))}
function getCardData(card){const prep=card.dataset.prep==='true';if(prep)return{date:card.dataset.date,prep:true,items:[...card.querySelectorAll('.prep-item')].map(item=>({checked:item.querySelector('input').checked,text:item.querySelector('textarea').value}))};const textareas=[...card.querySelectorAll(':scope > .line textarea')],money=[...card.querySelectorAll('.money-row')].map(row=>({eur:row.querySelector('.eur').value,krw:row.querySelector('.krw').value})),lists=[...card.querySelectorAll('.todo-list')];return{date:card.dataset.date,prep:false,where:textareas[0]?.value||'',stay:textareas[1]?.value||'',transport:textareas[2]?.value||'',stayMoney:money[0]||{eur:'',krw:''},transportMoney:money[1]||{eur:'',krw:''},morning:[...lists[0].querySelectorAll('.todo')].map(item=>({checked:item.querySelector('input').checked,text:item.querySelector('textarea').value})),evening:[...lists[1].querySelectorAll('.todo')].map(item=>({checked:item.querySelector('input').checked,text:item.querySelector('textarea').value}))}}
function getNotes(boardId){return[...document.querySelectorAll(`#${boardId} .note textarea`)].map(t=>t.value)}
function collectPlannerData(){return{rate:document.getElementById('rate').value,cards:[...document.querySelectorAll('.day')].map(getCardData),notes:getNotes('notes'),packingNotes:getNotes('packingNotes'),updatedAt:new Date().toISOString()}}
function savePlanner(){if(isLoading)return;clearTimeout(saveTimer);saveTimer=setTimeout(savePlannerNow,500)}
async function savePlannerNow(){
  const data=collectPlannerData(), json=JSON.stringify(data);
  if(json===lastSavedJson)return;
  localStorage.setItem(STORAGE_KEY,json);
  const status=document.getElementById('saveStatus');
  try{
    status.textContent='Firebase에 저장 중...';
    await plannerDocRef.set(data);
    lastSavedJson=json;
    status.textContent='공동수정 저장됨';
    clearTimeout(window.saveStatusTimer);
    window.saveStatusTimer=setTimeout(()=>status.textContent='공동수정 연결됨',1500);
  }catch(e){
    status.textContent='Firebase 저장 실패 · 내 컴퓨터에 백업됨';
    console.error(e);
  }
}
function applyPlannerData(data){isLoading=true;if(data.rate)document.getElementById('rate').value=data.rate;const cards=[...document.querySelectorAll('.day')];data.cards?.forEach((saved,i)=>{const card=cards[i];if(!card)return;if(saved.prep){const list=card.querySelector('.prep-list');list.innerHTML='';(saved.items||[]).forEach(s=>{const div=document.createElement('div');div.className='prep-item';div.innerHTML=`<input type="checkbox" ${s.checked?'checked':''} onchange="savePlanner()"><textarea class="todo-text" oninput="autoResize(this); savePlanner();">${escapeHtml(s.text||'')}</textarea><button class="del" onclick="this.closest('.prep-item').remove(); savePlanner();">x</button>`;list.appendChild(div);autoResize(div.querySelector('textarea'))})}else{const textareas=[...card.querySelectorAll(':scope > .line textarea')];if(textareas[0]){textareas[0].value=saved.where||'';applyWhereColor(textareas[0]);autoResize(textareas[0])}if(textareas[1]){textareas[1].value=saved.stay||'';autoResize(textareas[1])}if(textareas[2]){textareas[2].value=saved.transport||'';autoResize(textareas[2])}const rows=[...card.querySelectorAll('.money-row')];if(rows[0]){rows[0].querySelector('.eur').value=saved.stayMoney?.eur||'';rows[0].querySelector('.krw').value=saved.stayMoney?.krw||''}if(rows[1]){rows[1].querySelector('.eur').value=saved.transportMoney?.eur||'';rows[1].querySelector('.krw').value=saved.transportMoney?.krw||''}const lists=[...card.querySelectorAll('.todo-list')];['morning','evening'].forEach((key,idx)=>{lists[idx].innerHTML='';(saved[key]||[]).forEach(todo=>{const item=document.createElement('div');item.className='todo';item.innerHTML=`<input type="checkbox" ${todo.checked?'checked':''} onchange="savePlanner()"><textarea class="todo-text" oninput="autoResize(this); savePlanner();">${escapeHtml(todo.text||'')}</textarea><button class="del" onclick="this.closest('.todo').remove(); savePlanner();">x</button>`;lists[idx].appendChild(item);autoResize(item.querySelector('textarea'))})})}});setupNoteBoard('notes');(data.notes||[]).forEach(note=>addNoteTo('notes',note,false));setupNoteBoard('packingNotes',true);(data.packingNotes||[]).forEach(note=>addNoteTo('packingNotes',note,true));isLoading=false}
async function loadPlannerFromFirebase(){
  try{
    const snap=await plannerDocRef.get();
    if(!snap.exists)return false;
    const data=snap.data();
    if(!data||!data.cards)return false;
    applyPlannerData(data);
    lastSavedJson=JSON.stringify(collectPlannerData());
    document.getElementById('saveStatus').textContent='공동수정 연결됨';
    return true;
  }catch(e){
    console.error(e);
    document.getElementById('saveStatus').textContent='Firebase 불러오기 실패 · 로컬 백업 사용';
    return false;
  }
}
function startFirebaseRealtime(){
  if(unsubscribeFirebase)unsubscribeFirebase();
  unsubscribeFirebase=plannerDocRef.onSnapshot(snap=>{
    if(!snap.exists)return;
    const data=snap.data();
    if(!data||!data.cards)return;
    const incomingJson=JSON.stringify(data);
    if(incomingJson===lastSavedJson)return;
    if(document.activeElement&&['TEXTAREA','INPUT'].includes(document.activeElement.tagName)){
      pendingRemoteData=data;
      document.getElementById('saveStatus').textContent='다른 사람이 수정함 · 입력 끝나면 반영됨';
      return;
    }
    applyPlannerData(data);
    lastSavedJson=JSON.stringify(collectPlannerData());
    document.getElementById('saveStatus').textContent='공동수정 연결됨';
  },e=>{
    console.error(e);
    document.getElementById('saveStatus').textContent='Firebase 연결 실패';
  });
}
document.addEventListener('focusout',()=>{
  if(!pendingRemoteData)return;
  const data=pendingRemoteData;
  pendingRemoteData=null;
  applyPlannerData(data);
  lastSavedJson=JSON.stringify(collectPlannerData());
  document.getElementById('saveStatus').textContent='공동수정 연결됨';
});
function loadPlannerFromLocal(){const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return false;applyPlannerData(JSON.parse(raw));lastSavedJson=JSON.stringify(collectPlannerData());return true}
async function startPlanner(){
  // 처음 화면을 만드는 동안에는 자동 저장을 잠깐 막는다.
  // 이유: 기본 환율/기본 포스트잇이 Firebase에 먼저 저장되어 기존 내용을 덮어쓰는 것을 방지하기 위해서.
  isLoading=true;

  setupNoteBoard('notes');
  addNoteTo('notes','Isolde 부부 만나기');
  addNoteTo('notes','루카스 부모님 만나기');
  addNoteTo('notes','베이킹 클래스 듣기');
  addNoteTo('notes','피크닉 가기');
  setupNoteBoard('packingNotes',true);
  addNoteTo('packingNotes','여권');
  addNoteTo('packingNotes','충전기 / 어댑터');
  addNoteTo('packingNotes','상비약');
  setupWhereColors();

  const loaded=await loadPlannerFromFirebase();

  if(!loaded){
    const localLoaded=loadPlannerFromLocal();
    if(!localLoaded){
      // Firebase에도 없고 내 컴퓨터 백업도 없을 때만, 방금 만든 기본 화면을 최초 저장한다.
      isLoading=false;
      savePlanner();
    }
  }

  // Firebase 또는 로컬 백업에서 불러온 경우에도, 여기서 저장 잠금을 확실히 푼다.
  isLoading=false;

  setTimeout(()=>document.querySelectorAll('textarea').forEach(autoResize),0);
  startFirebaseRealtime();
}
startPlanner();
</script>
</body>
</html>
